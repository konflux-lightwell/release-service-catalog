---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: python-sdist-mirror
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: release, managed, python, sdist, mirror, taisce-cuan
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: >-
    Phase 1 Managed Release Pipeline: evaluates ingested Python sdists from a Snapshot OCI artifact.

    Source mirroring is intentionally disabled until the taisce-cuan task and interface are available at
    a reviewed immutable revision. This pipeline must not resolve the unverified archive-sources task.
    The source-origin sidecar remains the authoritative input for future RHTL/PyPI integration; RHTL
    parameters are not required for the PyPI flow.

    Unlike wheel release pipelines, this pipeline does NOT perform wheel signing or Pulp wheel uploads.

  params:
    - name: release
      type: string
      description: The namespaced name of the Release CR.
    - name: releasePlan
      type: string
      description: The namespaced name of the ReleasePlan CR.
    - name: releasePlanAdmission
      type: string
      description: The namespaced name of the ReleasePlanAdmission CR.
    - name: releaseServiceConfig
      type: string
      description: The namespaced name of the ReleaseServiceConfig CR.
    - name: snapshot
      type: string
      description: The namespaced name of the Snapshot CR.
    - name: enterpriseContractPolicy
      type: string
      description: JSON string containing the Enterprise Contract policy configuration.
    - name: enterpriseContractExtraRuleData
      type: string
      description: Extra rule data for Enterprise Contract.
      default: ""
    - name: enterpriseContractTimeout
      type: string
      description: Timeout for Enterprise Contract evaluation.
      default: "1h0m0s"
    - name: taskGitRevision
      type: string
      description: Required full immutable catalog commit SHA supplied by deployment schema (must be 40 hex characters).
    - name: taisceCuanGitRevision
      type: string
      description: Required full Taisce v2 commit SHA supplied by deployment schema.
    - name: taisceImage
      type: string
      description: Required full immutable digest image for the Taisce task, supplied by deployment.
    - name: sourceOriginPath
      type: string
      description: Path to the source-origin sidecar in the extracted artifact.
      default: "source-origin.json"
    - name: ociStorage
      type: string
      description: OCI storage repository for Trusted Artifacts.
      default: "quay.io/konflux-ci/release-service-trusted-artifacts"
  workspaces:
    - name: release

  tasks:
    # Deployment admission must validate full immutable resolver revisions before resolver use.
    - name: validate-resolver-revisions
      taskSpec:
        params:
          - name: catalogRevision
          - name: taisceRevision
          - name: taisceImage
        steps:
          - name: validate
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/sh
              set -eu
              printf '%s\n' "$(params.catalogRevision)" "$(params.taisceRevision)" | grep -Eq '^[0-9a-fA-F]{40}$'
              printf '%s\n' "$(params.taisceImage)" | grep -Eq '^.+@sha256:[0-9a-fA-F]{64}$'
              test -n "$(params.taisceRevision)"
      params:
        - name: catalogRevision
          value: $(params.taskGitRevision)
        - name: taisceRevision
          value: $(params.taisceCuanGitRevision)
        - name: taisceImage
          value: $(params.taisceImage)

    # ── 1. Collect release and snapshot data ──────────────────────────────────
    - name: collect-data
      runAfter: [validate-resolver-revisions]
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-ci/release-service-catalog.git
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-data/collect-data.yaml
      params:
        - name: release
          value: $(params.release)
        - name: releasePlan
          value: $(params.releasePlan)
        - name: releasePlanAdmission
          value: $(params.releasePlanAdmission)
        - name: releaseServiceConfig
          value: $(params.releaseServiceConfig)
        - name: snapshot
          value: $(params.snapshot)
        - name: subdirectory
          value: data
        - name: taskGitUrl
          value: https://github.com/konflux-ci/release-service-catalog.git
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(params.ociStorage)

    # ── 2. Collect task parameters from ReleasePlanAdmission data ─────────────
    - name: collect-task-params
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-ci/release-service-catalog.git
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-task-params/collect-task-params.yaml
      runAfter:
        - collect-data
      params:
        - name: taskGitUrl
          value: https://github.com/konflux-ci/release-service-catalog.git
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: dataPath
          value: $(tasks.collect-data.results.data)
        - name: keysToExtract
          value: |
            [
              {"resultIndex": 0, "key": ".gitForgeUrl"},
              {"resultIndex": 1, "key": ".gitGroup"},
              {"resultIndex": 2, "key": ".gitSecretName"},
              {"resultIndex": 3, "key": ".committerName"},
              {"resultIndex": 4, "key": ".committerEmail"},
              {"resultIndex": 5, "key": ".allowSourceOverwrite", "default": "false"},
              {"resultIndex": 6, "key": ".packageName"},
              {"resultIndex": 7, "key": ".packageVersion"},
              {"resultIndex": 8, "key": ".cosignSecretName"},
              {"resultIndex": 9, "key": ".cosignPublicKeyPath"}
            ]

    # ── 3. Reduce Snapshot ───────────────────────────────────────────────────
    - name: reduce-snapshot
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-ci/release-service-catalog.git
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/reduce-snapshot/reduce-snapshot.yaml
      runAfter:
        - collect-data
      params:
        - name: SNAPSHOT
          value: $(tasks.collect-data.results.snapshot)
        - name: SINGLE_COMPONENT
          value: "false"
        - name: taskGitUrl
          value: https://github.com/konflux-ci/release-service-catalog.git
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(params.ociStorage)

    # ── 4. Verify Enterprise Contract (Conforma) ──────────────────────────────
    - name: verify-enterprise-contract
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-ci/release-service-catalog.git
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/verify-enterprise-contract/verify-enterprise-contract.yaml
      runAfter:
        - reduce-snapshot
      params:
        - name: SNAPSHOT_FILENAME
          value: $(tasks.reduce-snapshot.results.reducedSnapshotPath)
        - name: POLICY_CONFIGURATION
          value: $(params.enterpriseContractPolicy)
        - name: STRICT
          value: "1"
        - name: EXTRA_RULE_DATA
          value: $(params.enterpriseContractExtraRuleData)
        - name: TIMEOUT
          value: $(params.enterpriseContractTimeout)
        - name: SOURCE_DATA_ARTIFACT
          value: "$(tasks.reduce-snapshot.results.sourceDataArtifact)"
        - name: taskGitUrl
          value: https://github.com/konflux-ci/release-service-catalog.git
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(params.ociStorage)

    # ── 5. Extract sdist + Chains provenance from OCI artifact ───────────────
    - name: extract-py-artifacts
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-ci/release-service-catalog.git
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/extract-py-artifacts/extract-py-artifacts.yaml
      runAfter:
        - verify-enterprise-contract
      params:
        - name: SNAPSHOT_PATH
          value: $(tasks.reduce-snapshot.results.reducedSnapshotPath)
        - name: sourceDataArtifact
          value: "$(tasks.verify-enterprise-contract.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: taskGitUrl
          value: https://github.com/konflux-ci/release-service-catalog.git
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: dataDir
          value: /var/workdir/content
        - name: dataPath
          value: $(tasks.collect-data.results.data)

    # Prepare and validate signing boundary before publication.
    - name: prepare-release-inputs
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/release-service-catalog.git
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/prepare-lightwell-release-inputs/prepare-lightwell-release-inputs.yaml
      runAfter:
        - extract-py-artifacts
      params:
        - name: sourceDataArtifact
          value: $(tasks.extract-py-artifacts.results.sourceDataArtifact)
        - name: packageName
          value: $(tasks.collect-task-params.results.extractedValues[6])
        - name: packageVersion
          value: $(tasks.collect-task-params.results.extractedValues[7])
        - name: dataDir
          value: /var/workdir/content
        - name: sourceOriginPath
          value: $(params.sourceOriginPath)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: taskGitUrl
          value: https://github.com/konflux-ci/release-service-catalog.git
        - name: taskGitRevision
          value: $(params.taskGitRevision)
      workspaces:
        - name: release
          workspace: release

    - name: sign-release
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/release-service-catalog.git
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/sign-lightwell-release/sign-lightwell-release.yaml
      runAfter: [prepare-release-inputs]
      params:
        - name: sourceOriginPath
          value: $(tasks.prepare-release-inputs.results.sourceOriginPath)
        - name: sdistPath
          value: $(tasks.prepare-release-inputs.results.sdistPath)
        - name: transformationPath
          value: $(tasks.prepare-release-inputs.results.transformationPath)
        - name: rhtlResponsePath
          value: $(tasks.prepare-release-inputs.results.rhtlResponsePath)
        - name: cosignSecretName
          value: $(tasks.collect-task-params.results.extractedValues[8])
        - name: packageName
          value: $(tasks.collect-task-params.results.extractedValues[6])
        - name: packageVersion
          value: $(tasks.collect-task-params.results.extractedValues[7])
      workspaces:
        - name: release
          workspace: release

    - name: verify-release
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/release-service-catalog.git
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/verify-lightwell-release/verify-lightwell-release.yaml
      runAfter: [sign-release]
      params:
        - name: signerAuthorizationPath
          value: $(tasks.sign-release.results.signerAuthorizationPath)
        - name: metadataPath
          value: $(tasks.sign-release.results.metadataPath)
        - name: sdistPath
          value: $(tasks.prepare-release-inputs.results.sdistPath)
        - name: artifactBoundaryPath
          value: $(tasks.sign-release.results.artifactBoundaryPath)
        - name: cosignPublicKeySecretName
          value: $(tasks.collect-task-params.results.extractedValues[9])
      workspaces:
        - name: release
          workspace: release

    - name: push-source
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-lightwell/taisce-cuan.git
          - name: revision
            value: $(params.taisceCuanGitRevision)
          - name: pathInRepo
            value: tekton/tasks/push-source-to-lightwell-builds/0.1/push-source-to-lightwell-builds.yaml
      runAfter:
        - verify-release
      params:
        - name: image
          value: $(params.taisceImage)
        - name: sdistPath
          value: $(tasks.prepare-release-inputs.results.sdistPath)
        - name: sourceOriginPath
          value: $(tasks.prepare-release-inputs.results.sourceOriginPath)
        - name: signerAuthorizationPath
          value: $(tasks.sign-release.results.signerAuthorizationPath)
        - name: artifactBoundaryPath
          value: $(tasks.sign-release.results.artifactBoundaryPath)
        - name: gitSecretName
          value: $(tasks.collect-task-params.results.extractedValues[2])
        - name: gitlabUrl
          value: $(tasks.collect-task-params.results.extractedValues[0])
        - name: packageName
          value: $(tasks.collect-task-params.results.extractedValues[6])
        - name: packageVersion
          value: $(tasks.collect-task-params.results.extractedValues[7])
        - name: gitlabGroup
          value: $(tasks.collect-task-params.results.extractedValues[1])
      workspaces:
        - name: workspace
          workspace: release

  finally:
    # ── 7. Cleanup internal requests ─────────────────────────────────────────
    - name: cleanup-internal-requests
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-ci/release-service-catalog.git
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/cleanup-internal-requests/cleanup-internal-requests.yaml
      params:
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: taskGitUrl
          value: https://github.com/konflux-ci/release-service-catalog.git
        - name: taskGitRevision
          value: $(params.taskGitRevision)
