---
# yamllint disable rule:line-length
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: materialize-lightwell-carrier
spec:
  description: >-
    Copies the immutable Lightwell carrier closure from the extracted Trusted Artifact files directory into the
    release workspace. Paths are confined to the extracted carrier, destinations must not already exist, and every
    copy is verified byte-for-byte before prepare or signing can consume it.
  params:
    - name: sourceDataArtifact
      type: string
    - name: taskGitUrl
      type: string
    - name: taskGitRevision
      type: string
    - name: ociStorage
      type: string
    - name: sourceOriginPath
      type: string
      default: source-origin.json
    - name: transformationPath
      type: string
      default: sdist-transformation.json
    - name: rhtlResponsePath
      type: string
      default: rhtl-response.json
    - name: provenanceResponsePath
      type: string
      default: provenance-response.bin
  workspaces:
    - name: release
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      - name: HOME
        value: /tekton/home
      - name: IMAGE_EXPIRES_AFTER
        value: 1d
      - name: ORAS_OPTIONS
        value: ""
  steps:
    - name: use-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(workspaces.release.path)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: materialize
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits: {memory: 128Mi}
        requests: {memory: 128Mi, cpu: 10m}
      command: [bash]
      args:
        - -ceu
        - |
          root="$(workspaces.release.path)"
          files="${root}/content/files"
          safe_path() { case "$1" in /*|*../*|../*|*//*|'') return 1;; esac; }
          copy_one() {
            local rel="$1" src="${files}/$1" dst="${root}/$1"
            safe_path "${rel}"
            test -f "${src}" && test ! -e "${dst}"
            mkdir -p "$(dirname "${dst}")"
            cp --preserve=all -- "${src}" "${dst}"
            cmp -s -- "${src}" "${dst}"
            test "$(sha256sum "${src}" | awk '{print $1}')" = "$(sha256sum "${dst}" | awk '{print $1}')"
          }
          copy_one "$(params.sourceOriginPath)"
          copy_one "$(params.transformationPath)"
          output_path="$(jq -r '.output.path // empty' "${root}/$(params.transformationPath)")"
          safe_path "${output_path}"
          test -n "${output_path}"
          copy_one "${output_path}"
          origin="${root}/$(params.sourceOriginPath)"
          registry="$(jq -r '.source_registry // .registry // empty' "${origin}")"
          provenance_present="$(jq -r 'if has("provenance_url") then "true" else "false" end' "${origin}")"
          provenance_url="$(jq -r '.provenance_url // empty' "${origin}")"
          case "${registry}" in
            pypi.org)
              # PyPI carries neither response artifact, and any advertised field is invalid for this source.
              test "${provenance_present}" = false
              ;;
            rhtl)
              if [ "${provenance_present}" = true ]; then
                # A present field is an advertisement: empty or malformed values must fail, never downgrade.
                printf '%s' "${provenance_url}" | grep -Eq '^https?://[^[:space:]]+$'
                copy_one "$(params.provenanceResponsePath)"
              else
                copy_one "$(params.rhtlResponsePath)"
              fi
              ;;
            *)
              printf 'unsupported source registry: %s\n' "${registry}" >&2
              exit 1
              ;;
          esac
          test "$(find "${files}" -type f -name "$(basename "$(params.sourceOriginPath)")" -print -quit)" = "${files}/$(params.sourceOriginPath)"
          test -s "${root}/$(params.sourceOriginPath)"
          test -s "${root}/$(params.transformationPath)"
