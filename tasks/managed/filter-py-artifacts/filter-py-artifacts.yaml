---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: filter-py-artifacts
spec:
  description: |
    Filter extracted Python artifacts against build-index purls using `slan-cuan build-index-filter`.
    Discovers the build-index.json OCI referrer on the component image, fails closed
    if missing or ambiguous, and filters the payload directory. Remediated releases keep
    only artifacts whose coordinates match index purls; validated releases can pass
    PUBLISH_ALL="true" to keep all artifacts.
  params:
    - name: SNAPSHOT_PATH
      type: string
      description: Path to the reduced snapshot spec (relative to dataDir).
      default: ""
    - name: IMAGE
      type: string
      description: Container image reference (digest-pinned) to discover build-index from. If empty, sourced from SNAPSHOT_PATH.
      default: ""
    - name: filesDir
      type: string
      description: The relative path within dataDir where payload files are located
      default: files
    - name: payloadDir
      type: string
      description: Directory containing payload files to filter. Overrides filesDir if set.
      default: ""
    - name: PUBLISH_ALL
      type: string
      description: Whether to publish all artifacts without filtering by build-index purls ("true" or "false")
      default: "false"
    - name: sourceDataArtifact
      type: string
      description: Trusted Artifact containing the reduced snapshot spec and files
    - name: dataDir
      type: string
      description: The location where data will be stored
      default: /var/workdir
    - name: ociArtifactExpiresAfter
      type: string
      description: Expiration date for the trusted artifacts created
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: ociStorage
      type: string
      description: The OCI repository where the Trusted Artifacts are stored
  results:
    - name: sourceDataArtifact
      description: Produced trusted data artifact
      type: string
    - name: CONSUMED_BUILD_INDEX_DIGEST
      description: Digest of the consumed build-index.json
      type: string
  volumes:
    - name: workdir
      emptyDir: {}
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
  steps:
    - name: prepare-workdir
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 32Mi
          cpu: 10m
        requests:
          memory: 32Mi
          cpu: 10m
      command:
        - mkdir
        - -p
        - $(params.dataDir)
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 10m
        requests:
          memory: 64Mi
          cpu: 10m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: prepare-oci-auth
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 64Mi
          cpu: 100m
        requests:
          memory: 64Mi
          cpu: 100m
      env:
        - name: HOME
          value: /tekton/home
        - name: DATA_DIR
          value: $(params.dataDir)
        - name: SNAPSHOT_PATH
          value: $(params.SNAPSHOT_PATH)
        - name: IMAGE
          value: $(params.IMAGE)
      script: |
        #!/bin/bash
        set -euo pipefail

        AUTH_OUT="${DATA_DIR}/oci-auth.json"
        IMAGES_TXT="${DATA_DIR}/filter-images.txt"
        PER_IMAGE_AUTH="${DATA_DIR}/per-image-auth.json"

        if [ -n "${IMAGE}" ]; then
          echo "${IMAGE}" > "${IMAGES_TXT}"
        elif [ -n "${SNAPSHOT_PATH}" ] && [ -f "${DATA_DIR}/${SNAPSHOT_PATH}" ]; then
          jq -r '.components[].containerImage' "${DATA_DIR}/${SNAPSHOT_PATH}" | sort -u > "${IMAGES_TXT}"
        else
          echo "ERROR: Neither IMAGE nor valid SNAPSHOT_PATH provided"
          exit 1
        fi

        echo '{"auths":{}}' > "${AUTH_OUT}"
        while read -r IMG; do
          [ -n "${IMG}" ] || continue
          echo "Selecting registry auth for ${IMG}"
          select-oci-auth "${IMG}" > "${PER_IMAGE_AUTH}"
          jq -s '.[0] * .[1]' "${AUTH_OUT}" "${PER_IMAGE_AUTH}" > "${AUTH_OUT}.tmp"
          mv "${AUTH_OUT}.tmp" "${AUTH_OUT}"
        done < "${IMAGES_TXT}"
        rm -f "${PER_IMAGE_AUTH}"

        echo "Wrote registry auth for $(wc -l < "${IMAGES_TXT}") image(s) to ${AUTH_OUT}"
    - name: filter
      image: quay.io/light-castle/slan-cuan:latest
      computeResources:
        limits:
          memory: 512Mi
          cpu: 500m
        requests:
          memory: 512Mi
          cpu: 250m
      script: |
        #!/bin/bash
        set -euo pipefail

        DATA_DIR="$(params.dataDir)"
        IMAGES_TXT="${DATA_DIR}/filter-images.txt"

        if [ -n "$(params.IMAGE)" ]; then
          IMAGE_REF="$(params.IMAGE)"
        elif [ -f "${IMAGES_TXT}" ]; then
          IMAGE_REF=$(head -n 1 "${IMAGES_TXT}")
        else
          echo "ERROR: No image reference found"
          exit 1
        fi

        PAYLOAD_DIR="$(params.payloadDir)"
        if [ -z "${PAYLOAD_DIR}" ]; then
          PAYLOAD_DIR="${DATA_DIR}/$(params.filesDir)"
        fi

        AUTH_FILE="${DATA_DIR}/oci-auth.json"
        AUTH_ARGS=()
        if [ -f "${AUTH_FILE}" ]; then
          AUTH_ARGS=(--registry-auth-file "${AUTH_FILE}")
        fi

        PUBLISH_ALL_ARGS=()
        if [ "$(params.PUBLISH_ALL)" = "true" ]; then
          PUBLISH_ALL_ARGS=(--publish-all)
        fi

        slan-cuan --verbose --tekton-results-dir /tekton/results \
          build-index-filter \
          --image-ref "${IMAGE_REF}" \
          --payload-dir "${PAYLOAD_DIR}" \
          "${AUTH_ARGS[@]}" \
          "${PUBLISH_ALL_ARGS[@]}"

        REPORT_PATH="${DATA_DIR}/filter-report.json"
        if [ -f "${REPORT_PATH}" ]; then
          DIGEST=$(jq -r '.consumed_build_index_digest // .consumed_digest // empty' "${REPORT_PATH}")
          if [ -n "${DIGEST}" ]; then
            echo -n "${DIGEST}" > "$(results.CONSUMED_BUILD_INDEX_DIGEST.path)"
          fi
        fi
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
