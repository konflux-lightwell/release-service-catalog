---
# yamllint disable rule:line-length
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-lightwell-release-inputs
spec:
  description: >-
    Materializes the extracted Trusted Artifact into the shared release workspace and validates acquisition
    metadata. It does not authorize publication or create DSSE evidence.
  params:
    - name: sourceDataArtifact
      type: string
    - name: dataDir
      type: string
      default: "."
    - name: sourceOriginType
      type: string
      default: pypi
    - name: sourceOriginPath
      type: string
      default: source-origin.json
    - name: sdistPath
      type: string
    - name: ociStorage
      type: string
    - name: taskGitUrl
      type: string
    - name: taskGitRevision
      type: string
    - name: orasOptions
      type: string
      default: ""
  workspaces:
    - name: release
  results:
    - name: sdistPath
    - name: sourceOriginPath
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      - name: HOME
        value: /tekton/home
      - name: IMAGE_EXPIRES_AFTER
        value: 1d
      - name: ORAS_OPTIONS
        value: $(params.orasOptions)
  steps:
    - name: use-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(workspaces.release.path)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: validate-inputs
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits: {memory: 128Mi}
        requests: {memory: 128Mi, cpu: 10m}
      command: [bash]
      args:
        - -ceu
        - |
          root="$(workspaces.release.path)"
          origin="${root}/$(params.sourceOriginPath)"
          candidate="${root}/$(params.sdistPath)"
          test -s "${origin}" || { echo "missing source-origin.json" >&2; exit 1; }
          if [ -d "${candidate}" ]; then
            mapfile -t files < <(find "${candidate}" -maxdepth 1 -type f -name '*.tar.gz' -print)
            test "${#files[@]}" -eq 1 || { echo "expected exactly one sdist" >&2; exit 1; }
            candidate="${files[0]}"
          fi
          test -s "${candidate}" || { echo "missing sdist" >&2; exit 1; }
          jq -e --arg type "$(params.sourceOriginType)" \
            'type == "object" and ((.source_registry // "") | type == "string") and ((.package // "") | type == "string") and ((.version // "") | type == "string") and ((.verified_sha256 // "") | test("^[0-9a-fA-F]{64}$"))' "${origin}" >/dev/null || {
              echo "source-origin lacks canonical package/version/registry and verified_sha256" >&2; exit 1; }
          relative="${candidate#${root}/}"
          origin_relative="${origin#${root}/}"
          printf '%s' "${relative}" > "$(results.sdistPath.path)"
          printf '%s' "${origin_relative}" > "$(results.sourceOriginPath.path)"
