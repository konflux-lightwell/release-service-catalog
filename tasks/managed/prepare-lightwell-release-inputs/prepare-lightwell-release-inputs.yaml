---
# yamllint disable rule:line-length
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-lightwell-release-inputs
spec:
  description: >-
    Materializes and fail-closed validates the OCI carrier: source-origin.json, sdist-transformation.json,
    optional opaque rhtl-response.json, and the normalized sdist. All identities and independent digests are checked.
  params:
    - name: sourceDataArtifact
      type: string
    - name: dataDir
      type: string
      default: "."
    - name: sourceOriginType
      type: string
      default: pypi
    - name: sourceOriginPath
      type: string
      default: source-origin.json
    - name: transformationPath
      type: string
      default: sdist-transformation.json
    - name: rhtlResponsePath
      type: string
      default: rhtl-response.json
    - name: sdistPath
      type: string
    - name: ociStorage
      type: string
    - name: taskGitUrl
      type: string
    - name: taskGitRevision
      type: string
    - name: packageName
      type: string
    - name: packageVersion
      type: string
    - name: sourceRegistry
      type: string
  workspaces:
    - name: release
  results:
    - name: sdistPath
    - name: sourceOriginPath
    - name: transformationPath
    - name: rhtlResponsePath
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      - name: HOME
        value: /tekton/home
      - name: IMAGE_EXPIRES_AFTER
        value: 1d
      - name: ORAS_OPTIONS
        value: ""
  steps:
    - name: use-trusted-artifact
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(workspaces.release.path)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: validate-inputs
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits: {memory: 128Mi}
        requests: {memory: 128Mi, cpu: 10m}
      command: [bash]
      args:
        - -ceu
        - |
          root="$(workspaces.release.path)"
          origin="${root}/$(params.sourceOriginPath)"
          transformation="${root}/$(params.transformationPath)"
          archive="${root}/$(params.sdistPath)"
          test -s "${origin}" && test -s "${transformation}" && test -s "${archive}"
          source_sha="$(sha256sum "${origin}" | awk '{print $1}')"
          archive_sha="$(sha256sum "${archive}" | awk '{print $1}')"
          jq -e --arg p "$(params.packageName)" --arg v "$(params.packageVersion)" --arg r "$(params.sourceRegistry)" \
            '.package == $p and .version == $v and .source_registry == $r and (.verified_sha256|test("^[0-9a-fA-F]{64}$"))' "${origin}" >/dev/null
          jq -e --arg input "$(jq -r '.input.sha256' "${transformation}")" --arg origin "$(jq -r '.source_origin.sha256' "${transformation}")" --arg output "${archive_sha}" \
            '.schema == "lightwell.sdist-transformation" and .input.sha256 == $input and .source_origin.sha256 == $origin and .output.sha256 == $output and $input == (.source_origin.sha256)' "${transformation}" >/dev/null
          test "${source_sha}" = "$(jq -r '.verified_sha256' "${origin}" | tr '[:upper:]' '[:lower:]')"
          test "$(jq -r '.source_origin.sha256' "${transformation}" | tr '[:upper:]' '[:lower:]')" = "${source_sha}"
          test "$(jq -r '.output.sha256' "${transformation}" | tr '[:upper:]' '[:lower:]')" = "${archive_sha}"
          if [ "$(params.sourceOriginType)" = rhtl ]; then
            test -s "${root}/$(params.rhtlResponsePath)"
          fi
          printf '%s' "$(params.sdistPath)" > "$(results.sdistPath.path)"
          printf '%s' "$(params.sourceOriginPath)" > "$(results.sourceOriginPath.path)"
          printf '%s' "$(params.transformationPath)" > "$(results.transformationPath.path)"
          printf '%s' "$(params.rhtlResponsePath)" > "$(results.rhtlResponsePath.path)"
